  <path d="M923 1426l67 14 53 42 10 65-31 57-61 27-76-13-47-52 10-72 33-47z" fill="#4b5e6a"/>
  <path d="M930 1477c43-24 87-8 92 24 5 35-28 62-62 69-39 8-86-5-90-42-3-23 17-39 60-51z" fill="#5e7684"/>
  <path d="M925 1515c17-24 56-28 81-10 21 16 20 48-5 70-18 17-47 22-67 13-30-12-33-45-9-73z" fill="#2f5568"/>

