  <path class="ridge" d="M364 278l80 12 57 40 38 68 74 45 77 16 97 60"/>
  <path class="ridge" d="M763 685l-71 49-68 64-39 83-55 47-44 79"/>
  <path class="ridge" d="M231 745l46 54 37 76 71 65 32 71 58 53"/>
  <path class="ridge" d="M834 1036l-25 79-54 44-42 75-24 86"/>
  <path class="ridge" d="M307 1267l92 10 79 42 55 74 25 78"/>

  <!-- Vulcão sudoeste -->
  <circle cx="243" cy="1313" r="73" fill="#47382f" stroke="#1b1a17" stroke-width="8" filter="url(#shadow)"/>
  <circle cx="243" cy="1313" r="43" fill="#6e0f08"/>
  <circle cx="243" cy="1313" r="24" fill="#b01c12"/>

  <!-- Cratera central -->
  <g filter="url(#shadow)">
    <ellipse cx="533" cy="782" rx="67" ry="39" fill="#5a5147"/>
    <circle cx="495" cy="758" r="15" fill="#991d18"/>
    <circle cx="525" cy="739" r="15" fill="#991d18"/>
