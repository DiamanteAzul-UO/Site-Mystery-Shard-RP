<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1900" role="img" aria-label="Mapa estilizado de Hellfar e Myrthos">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <pattern id="forestDots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="7" r="2" fill="#40531a" opacity="0.8"/>
      <circle cx="17" cy="14" r="2.4" fill="#556d21" opacity="0.85"/>
      <circle cx="11" cy="20" r="1.8" fill="#304213" opacity="0.75"/>
    </pattern>
    <pattern id="snowDots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="7" r="1.2" fill="#d8d4cc" opacity="0.75"/>
      <circle cx="13" cy="12" r="1.1" fill="#bdb8ac" opacity="0.7"/>
    </pattern>
    <pattern id="sandDots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="7" r="1.2" fill="#d8c28a" opacity="0.65"/>
      <circle cx="14" cy="13" r="1.2" fill="#b89d61" opacity="0.55"/>
    </pattern>
    <style>
      .shore{stroke:#11222c;stroke-width:8;stroke-linejoin:round;filter:url(#shadow)}
      .ridge{fill:none;stroke:#67645d;stroke-width:18;stroke-linecap:round;stroke-linejoin:round;opacity:.95}
      .river{fill:none;stroke:#255d76;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
      .label{font-family:Georgia, serif;font-size:30px;fill:#e6d8ab;letter-spacing:3px;text-anchor:middle}
      .sublabel{font-family:Georgia, serif;font-size:18px;fill:#a89e87;letter-spacing:1.5px;text-anchor:middle}
    </style>
  </defs>

  <rect width="1200" height="1900" fill="#0e5069"/>

  <!-- Norte nevado -->
  <path class="shore" fill="#e6e4df" d="M472 70l59 29 38 59 34 6 41 74-19 74 59 24 20 49 68 13 27 54-24 53 17 62-31 45-80 19-67 45-59 7-78 55-61-16-58 24-89-19-56 34-86-14-27-57-63-37 14-53-33-47 14-45 57-33 50-74 37-6 40-63 70-31 30-44 63-10 58-48z"/>
  <path d="M480 98l50 25 30 45 22 4 38 64-15 63 49 20 18 38 57 11 18 39-18 40 14 44-24 37-65 15-61 40-52 6-71 51-52-13-49 20-80-17-49 30-66-10-21-44-51-31 10-44-27-38 12-38 47-27 43-65 30-5 35-53 56-24 26-39 52-8 50-41z" fill="url(#snowDots)" opacity=".62"/>

  <!-- Centro principal -->
  <path class="shore" fill="#637312" d="M220 640l85-39 72 11 73-25 72 19 76-14 111 14 53 42 94-20 72 20 74 49 41 75 43 18 83 64-11 85-63 43-82 16-43 33-63 16-31 57 21 77-50 69-78 27-47 45-16 85-90 51-77-28-61 17-65-15-47-43-39-93-61-48-43-87 21-73-49-54-18-104 24-72-30-72 39-45z"/>
  <path d="M243 652l66-32 59 9 67-21 62 15 70-13 97 13 46 33 87-19 63 17 61 42 35 66 34 15 71 56-9 67-56 37-68 13-35 28-55 14-28 50 19 66-44 60-65 22-41 39-14 76-76 42-68-24-55 15-55-12-40-38-32-83-54-42-36-74 18-62-42-48-15-87 20-62-25-62 35-38z" fill="url(#forestDots)" opacity=".55"/>

  <!-- Deserto central-sul -->
  <path class="shore" fill="#d8bf80" d="M455 895l123 23 145-24 88 23 108 70 32 95-19 98 29 67-55 79 17 110-34 88-63 36-29 79-103 18-88-34-76 10-75-25-36-54-88-41-55-77-34-74-15-93 27-74-26-55 20-80 58-57z"/>
  <path d="M476 913l103 19 129-22 76 20 94 60 27 84-17 84 25 57-47 69 14 96-30 75-52 29-24 68-88 15-77-29-67 8-65-21-30-47-75-35-48-66-29-65-13-79 22-63-23-48 18-68 49-49z" fill="url(#sandDots)" opacity=".64"/>

  <!-- Sul selvagem -->
  <path class="shore" fill="#536719" d="M330 1400l78-14 93 14 51 57 63 11 58 79 6 63 40 39 57 11 58 72-15 68-63 39-80 14-74-14-53 18-85-26-44-66-72-35-46-78-8-81-33-61 26-64-28-46 19-62z"/>
  <path d="M348 1412l67-11 79 12 44 49 53 9 52 69 5 55 34 33 49 9 50 61-12 57-53 32-69 12-64-12-45 14-74-23-38-56-62-30-40-69-7-70-29-53 23-55-24-39 16-53z" fill="url(#forestDots)" opacity=".53"/>

