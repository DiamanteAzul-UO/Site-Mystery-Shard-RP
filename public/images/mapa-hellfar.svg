    <circle cx="530" cy="821" r="15" fill="#991d18"/>
    <circle cx="495" cy="799" r="15" fill="#991d18"/>
  </g>

  <!-- Rios -->
  <path class="river" d="M430 642c-8 49 17 89 47 117 26 25 49 56 61 101 11 40 11 83 5 117-10 54-1 91 28 135 31 46 31 93 14 149"/>
  <path class="river" d="M221 827c56-27 99-24 147 1 34 18 60 47 85 70 32 28 55 72 67 126"/>
  <path class="river" d="M716 598c-2 58 17 102 54 144 40 44 56 88 58 150 1 46 12 95 45 145"/>
  <path class="river" d="M573 1478c-23 43-27 93-19 138 8 44 31 95 77 128"/>
  <path class="river" d="M389 1614c-1 48 7 91 26 124 22 38 61 76 114 107"/>

  <!-- Cidades / fortalezas -->
  <g filter="url(#shadow)">
    <!-- Capital Aramor -->
    <rect x="121" y="1302" width="92" height="70" fill="#7f7d77" stroke="#34302b" stroke-width="4"/>
    <rect x="130" y="1310" width="25" height="18" fill="#56524c"/>
    <rect x="161" y="1310" width="25" height="18" fill="#56524c"/>
    <rect x="131" y="1335" width="56" height="28" fill="#56524c"/>
    <rect x="190" y="1321" width="14" height="32" fill="#56524c"/>
    <!-- Thessomar -->
    <rect x="717" y="1731" width="72" height="43" fill="#988b70" stroke="#514837" stroke-width="4"/>
    <rect x="730" y="1740" width="14" height="14" fill="#7e7059"/>
    <rect x="746" y="1740" width="14" height="14" fill="#7e7059"/>
    <rect x="763" y="1740" width="14" height="14" fill="#7e7059"/>
    <!-- Ruína da Colônia -->
    <rect x="608" y="986" width="49" height="36" fill="#b07f63" stroke="#51352a" stroke-width="4"/>
    <!-- Forte Norte -->
    <rect x="502" y="1134" width="57" height="42" fill="#c1b089" stroke="#6d5a37" stroke-width="4"/>
    <!-- Torre nevada -->
    <rect x="610" y="545" width="85" height="15" fill="#9b9a95" stroke="#4f514f" stroke-width="3"/>
  </g>
</svg>
